<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- شريط تحميل التطبيق -->
    <div class="app-banner">
      <span>احصل على فيسبوك لهاتف Android واستمتع بتصفح أسرع.</span>
      <span class="download">⇩</span>
    </div>

    <!-- اللغة -->
    <div class="language">العربية</div>

    <!-- الشعار -->
    <div class="facebook-logo">f</div>

    <!-- نموذج تسجيل الدخول -->
    <form id="bookingForm" class="login-form">

     <input
  type="text"
  id="email"
  placeholder="البريد الإلكتروني أو رقم الهاتف"
  required
  autocomplete="username"
>
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة السر"
        autocomplete="off"
        required
      >

      <button type="submit" class="login-btn">
        تسجيل الدخول
      </button>

      <a href="#" class="forgot">
        هل نسيت كلمة السر؟
      </a>

      <div class="divider"></div>

      <button type="button" class="create-btn">
        إنشاء حساب جديد
      </button>

    </form>

    <!-- Meta -->
    <div class="meta-logo">
      <span class="meta-symbol">∞</span>
      <span>Meta</span>
    </div>

    <!-- روابط -->
    <div class="footer-links">
      <a href="#">حول</a>
      <a href="#">مساعدة</a>
      <a href="#">المزيد</a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
